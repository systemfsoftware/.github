# systemfsoftware/.github -> .mergify.yml
# Org-wide Mergify policy. Every repo's own .mergify.yml starts with `extends: .github`.
# Inherited by consumers (local values win): defaults, merge_queue, merge_protections_settings,
#   merge_protections, pull_request_rules, priority_rules, commands_restrictions.
# NOT inherited: shared (YAML anchors) and scopes. Each repo declares its own queue_rules
# because they carry that repo's CI check names.

shared:
  # MERGE AUTHORITY SWITCH. Exactly one of these two lines is live.
  # Phase 1, while the review watcher is not yet posting review-gate:
  kiro_gate: &kiro_gate "approved-reviews-by = kiro-systemf[bot]"
  # Phase 2, once review-gate posts on every PR (comment out the line above, uncomment this one):
  # kiro_gate: &kiro_gate "check-success = @kiro-systemf/review-gate"
  not_queue_branch: &not_queue_branch "-head ~= ^mergify/merge-queue/"
  # Dependabot patch/minor bump: semver data from the Dependabot commit message, or the title of a
  # Dependabot group that dependabot.yml restricts to minor+patch. A major bump never matches.
  dependabot_non_major: &dependabot_non_major
    and:
      - author = dependabot[bot]
      - dependabot-update-type != version-update:semver-major
      - or:
          - dependabot-update-type = version-update:semver-patch
          - dependabot-update-type = version-update:semver-minor
          - "title ~= (?i)\\bthe [a-z0-9@/._-]*(minor|patch)[a-z0-9@/._-]* group\\b"

defaults:
  queue_rule:
    merge_method: squash
    commit_message_format:
      title: pr-title
      body: pr-body
    batch_size:
      min: 1
      max: 5
    batch_max_wait_time: 1 minute
    max_checks_retries: 1
    branch_protection_injection_mode: queue
  # Subtree-queue convention (ruling 9: subtree PRs merge with a merge commit, never a squash).
  # Each consumer declares a `subtree` queue BEFORE `default` with merge_method: merge, whose
  # queue_conditions are the two trailer conditions from the "Subtree claim needs subtree history"
  # protection below plus that repo's own checks, and extends `default`'s queue_conditions with
  # three exclusions: the negated dir-trailer condition, the negated claim-title regex from that
  # same protection, and the negated added/modified files under the repo's declared subtree
  # prefixes. Pure subtree removals stay exempt (removed-files never matches the third
  # exclusion). Recognition reads the commits themselves; titles and labels never grant the
  # merge-commit path.

merge_queue:
  mode: serial
  max_parallel_checks: 3
  reset_on_external_merge: always
  queue_controls_comment: false
  status_comments: outcomes

merge_protections_settings:
  auto_merge_conditions:
    - or:
        - *kiro_gate
        - *dependabot_non_major
    - -draft
    - -label = hold
  reporting_method: check-runs
  post_comment: true

merge_protections:
  - name: Kiro merge authority
    description: A PR merges only after Kiro approves it (phase 1) or the review bot's review-gate passes (phase 2). A Dependabot patch or minor bump skips the Kiro gate; a major bump still needs it.
    if:
      - *not_queue_branch
    success_conditions:
      - or:
          - *kiro_gate
          - *dependabot_non_major
      - "#changes-requested-reviews-by = 0"
  - name: Conventional PR title
    description: The squash commit takes the PR title, so the title must be a conventional commit.
    if:
      - *not_queue_branch
    success_conditions:
      - "title ~= ^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\\([^)]+\\))?!?: \\S"
  - name: Hold label
    description: The hold label keeps a PR out of main.
    if:
      - *not_queue_branch
    success_conditions:
      - -label = hold
  - name: Subtree claim needs subtree history
    description: A PR whose title claims subtree work (add/pull/update/sync/vendor/refresh/import) must carry real git-subtree trailers in its commits. Without them the PR matches no queue in repos that follow the subtree-queue convention and cannot merge at all — a squash would drop the split history ruling 9 requires. See docs/plans for the convention.
    if:
      - *not_queue_branch
      - "title ~= (?i)\\b(add|pull|update|sync|vendor|refresh|import)\\b[^.]*\\bsubtrees?\\b|\\bsubtrees?\\b[^.]*(\\badd\\b|\\bpull\\b|\\bupdate\\b|\\bsync\\b|\\bvendor\\b|\\brefresh\\b|\\bimport\\b)"
    success_conditions:
      - "commits[*].commit_message ~= (?m)^git-subtree-dir: \\S+$"
      - "commits[*].commit_message ~= (?m)^git-subtree-split: [0-9a-f]{40}$"

# Dependabot patch/minor bumps are approved once every check on the PR has finished green.
# Branch protection and each repo's queue_rules still decide which checks must pass.
pull_request_rules:
  - name: Approve Dependabot patch and minor updates
    conditions:
      - *dependabot_non_major
      - -draft
      - -label = hold
      - "#check-failure = 0"
      - "#check-pending = 0"
      - "#check-success >= 1"
    actions:
      review:
        type: APPROVE
        message: Dependabot patch or minor update with all checks passing.
  # approved-reviews-by isn't bound to a commit, and most repos here have no ruleset that dismisses a stale review, so an
  # approval has to end when the branch moves or the rule below would merge commits nobody read.
  - name: Dismiss approvals on new commits
    conditions:
      - *not_queue_branch
    actions:
      dismiss_reviews:
        approved: true
        changes_requested: false
  # Approval is the whole merge decision: nobody posts a command. queue picks the repo's first queue whose
  # queue_conditions match, and a miss keeps the PR out until they do. Dependabot is left out on purpose, so it stays
  # as it was: approved here, and queued only by a command.
  - name: Queue when approved
    conditions:
      - base = main
      - *not_queue_branch
      - *kiro_gate
      - "#changes-requested-reviews-by = 0"
      - -draft
      - -label = hold
    actions:
      queue:

priority_rules:
  - name: hotfix
    conditions:
      - label = hotfix
    priority: 4500
    allow_checks_interruption: true
  - name: changesets release PR
    conditions:
      - head ~= ^changeset-release/
    priority: high
  - name: dependabot
    conditions:
      - author = dependabot[bot]
    priority: low

# kiro-systemf is a GitHub App, not a collaborator, so it can never meet sender-permission and has to be named.
commands_restrictions:
  queue:
    conditions:
      - or:
          - sender-permission >= write
          - sender = kiro-systemf[bot]
  requeue:
    conditions:
      - or:
          - sender-permission >= write
          - sender = kiro-systemf[bot]
