name: Actions storage cleanup

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions: {}

# One run at a time: two overlapping runs would race on the same deletes.
concurrency:
  group: actions-storage-cleanup
  cancel-in-progress: false

jobs:
  actions-storage:
    name: artifacts and caches no open work uses
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Mint the cleanup App's installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ARTIFACT_CLEANUP_APP_ID }}
          private-key: ${{ secrets.ARTIFACT_CLEANUP_APP_PRIVATE_KEY }}
          owner: systemfsoftware
          permission-actions: write
          permission-contents: read
          permission-pull-requests: read
      - name: Delete artifacts and caches that no open work uses
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: systemfsoftware
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?the cleanup App token was not minted}"
          work="$(mktemp -d)"

          # One repo. Every planned delete is a "repo<TAB>kind<TAB>id<TAB>bytes" line in $out.delete.
          # Artifacts (private repos only): those whose run's branch is the head of a closed or merged PR from this org.
          #   An artifact with no branch is kept.
          # Caches: one whose ref is refs/pull/N/merge of a closed or merged PR N; one on a branch that no longer exists
          #   (judged only when the branch list came back); one that a newer cache supersedes, meaning the same ref and
          #   the same key once its trailing hex hash is cut. The newest cache for each ref and key stays.
          # A listing that fails plans nothing for that rule.
          plan_repo() {
            local repo="$1" private="$2" out="$work/${1//\//_}"
            : > "$out.delete"
            gh api "repos/$repo/pulls?state=closed&per_page=100" --paginate \
              --jq '.[] | [.number, .head.ref, (.head.repo.owner.login // "")] | @tsv' > "$out.closed" 2>/dev/null || : > "$out.closed"
            local artifacts=0
            if [ "$private" = true ]; then
              awk -F'\t' -v org="$ORG" '$3 == org { print $2 }' "$out.closed" | sort -u > "$out.closedrefs"
              gh api "repos/$repo/actions/artifacts?per_page=100" --paginate \
                --jq '.artifacts[] | [((.workflow_run.head_branch // "") | if . == "" then "-" else . end), .id, (.size_in_bytes // 0)] | @tsv' \
                > "$out.artifacts" 2>/dev/null || : > "$out.artifacts"
              awk -F'\t' -v repo="$repo" 'NR == FNR { closed[$0] = 1; next } ($1 in closed) { print repo "\tartifacts\t" $2 "\t" $3 }' \
                "$out.closedrefs" "$out.artifacts" >> "$out.delete"
              artifacts="$(wc -l < "$out.artifacts")"
            fi
            gh api "repos/$repo/actions/caches?per_page=100" --paginate --jq '.actions_caches[]' \
              > "$out.caches" 2>/dev/null || : > "$out.caches"
            if gh api "repos/$repo/branches?per_page=100" --paginate --jq '.[].name' > "$out.branches" 2>/dev/null \
              && [ -s "$out.branches" ]; then branches_ok=true; else branches_ok=false; fi
            jq -rs --arg repo "$repo" --argjson branches_ok "$branches_ok" \
              --rawfile closed "$out.closed" --rawfile branches "$out.branches" '
              ($closed | split("\n") | map(select(. != "") | split("\t")[0])) as $prs
              | ($branches | split("\n") | map(select(. != ""))) as $live
              | map(. + { stem: (.key | sub("-[0-9a-f]{8,}$"; "")) })
              | (group_by([.ref, .stem]) | map(max_by(.created_at).id)) as $newest
              | .[]
              | select(
                  (((.ref | capture("^refs/pull/(?<n>[0-9]+)/merge$") | .n) // null) as $n
                    | $n != null and ($n | IN($prs[])))
                  or ($branches_ok and (.ref | startswith("refs/heads/"))
                      and ((.ref | ltrimstr("refs/heads/")) | IN($live[]) | not))
                  or (.id | IN($newest[]) | not))
              | [$repo, "caches", .id, (.size_in_bytes // 0)] | @tsv' "$out.caches" >> "$out.delete"
            echo "$artifacts $(jq -s length "$out.caches") $(wc -l < "$out.delete")" > "$out.counts"
          }
          export -f plan_repo
          export work

          # One delete, recorded in $work/{ok,gone,skipped,transient,fatal}. It stops issuing calls once the installation's
          # remaining quota is at or below MIN_REMAINING (the rate_limit call is not itself counted), retries HTTP 5xx
          # up to 3 times, backs off and retries GitHub's secondary limit (HTTP 429) up to 3 times and otherwise leaves the
          # delete to the next run, and files anything else by cause. $work/stop marks that the quota ran out.
          delete_one() {
            local repo="$1" kind="$2" id="$3" bytes="$4" left err code try
            if [ -e "$work/stop" ]; then echo "$repo $kind $id" >> "$work/skipped"; return 0; fi
            left="$(gh api rate_limit --jq .resources.core.remaining 2>/dev/null || echo 99999)"
            if [ "$left" -le "$MIN_REMAINING" ]; then
              touch "$work/stop"; echo "$repo $kind $id" >> "$work/skipped"; return 0
            fi
            for try in 1 2 3 4; do
              if err="$(gh api -X DELETE "repos/$repo/actions/$kind/$id" --silent 2>&1)"; then
                printf '%s\t%s\t%s\t%s\n' "$repo" "$kind" "$id" "$bytes" >> "$work/ok"
                sleep 6; return 0
              fi
              code="$(printf '%s' "$err" | grep -o 'HTTP [0-9]*' | head -1 | cut -d' ' -f2)"
              case "$code" in
                404) echo "$repo $kind $id" >> "$work/gone"; return 0 ;;
                429) [ "$try" -lt 4 ] && { sleep $((try * 20)); continue; }
                     echo "$repo $kind $id" >> "$work/skipped"; return 0 ;;
                5??) [ "$try" -lt 4 ] && { sleep $((try * 3)); continue; }
                     echo "$repo $kind $id HTTP $code" >> "$work/transient"; return 0 ;;
                *)   if printf '%s' "$err" | grep -qi 'rate limit'; then
                       touch "$work/stop"; echo "$repo $kind $id" >> "$work/skipped"
                     else
                       echo "$repo $kind $id HTTP ${code:-none}: $(printf '%s' "$err" | head -1)" >> "$work/fatal"
                     fi
                     return 0 ;;
              esac
            done
          }
          export -f delete_one
          export MIN_REMAINING=200

          # Repos are planned 4 at a time. Deletes run 8 at a time, each worker pausing 6 s after a delete, which keeps them
          # near GitHub's secondary limit of 80 write requests a minute.
          gh api "orgs/$ORG/repos?per_page=100" --paginate --jq '.[] | select(.archived | not) | "\(.full_name) \(.private)"' \
            | xargs -r -P 4 -n 2 bash -c 'plan_repo "$1" "$2"' _
          touch "$work/ok" "$work/gone" "$work/skipped" "$work/transient" "$work/fatal"
          cat "$work"/*.delete 2>/dev/null \
            | xargs -r -P 8 -n 4 bash -c 'delete_one "$@"' _

          artifacts=0; caches=0; planned=0
          for c in "$work"/*.counts; do
            read -r a k d < "$c"; artifacts=$((artifacts + a)); caches=$((caches + k)); planned=$((planned + d))
          done
          deleted="$(wc -l < "$work/ok")"
          reclaimed="$(awk -F'\t' '{ s += $4 } END { print s + 0 }' "$work/ok")"
          gone="$(wc -l < "$work/gone")"; skipped="$(wc -l < "$work/skipped")"
          transient="$(wc -l < "$work/transient")"; fatal="$(wc -l < "$work/fatal")"
          left="$(gh api rate_limit --jq .resources.core.remaining 2>/dev/null || echo unknown)"
          {
            echo '**Actions storage deleted**'
            echo
            echo '| repo | kind | deleted | bytes |'
            echo '|---|---|---|---|'
            awk -F'\t' '{ k = $1 "\t" $2; n[k]++; b[k] += $4 }
              END { for (k in n) { split(k, p, "\t"); print "| `" p[1] "` | " p[2] " | " n[k] " | " b[k] " |" } }' "$work/ok" \
              | sort -t'|' -k5 -rn
            echo
            echo "Deleted $deleted of $planned planned ($artifacts artifacts and $caches caches seen), $reclaimed bytes reclaimed."
            echo
            echo "- already gone (HTTP 404): $gone"
            echo "- not attempted, rate limited (next run continues): $skipped"
            echo "- failed, transient (HTTP 5xx after retries): $transient"
            echo "- failed, non-transient (4xx other than 404, or no HTTP status): $fatal"
            echo "- installation rate limit remaining at the end: $left"
          } >> "$GITHUB_STEP_SUMMARY"
          for kind in artifacts caches; do
            n="$(awk -F'\t' -v k="$kind" '$2 == k' "$work/ok" | wc -l)"
            b="$(awk -F'\t' -v k="$kind" '$2 == k { s += $4 } END { print s + 0 }' "$work/ok")"
            echo "::notice title=actions-storage-cleanup::$kind: deleted $n, reclaimed $b bytes"
          done
          echo "::notice title=actions-storage-cleanup::Deleted $deleted of $planned planned, reclaimed $reclaimed bytes; $skipped not attempted (rate limit), $transient transient failures, $fatal other failures"
          if [ "$fatal" -gt 0 ]; then
            echo "::error title=actions-storage-cleanup::$fatal deletes failed with a non-transient error"
            cut -d' ' -f4- "$work/fatal" | sort | uniq -c | sort -rn >&2
            exit 1
          fi
