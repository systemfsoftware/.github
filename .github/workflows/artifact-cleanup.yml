name: Artifact cleanup

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions: {}

# One run at a time: two overlapping runs would race on the same deletes.
concurrency:
  group: artifact-cleanup
  cancel-in-progress: false

jobs:
  closed-pull-request-artifacts:
    name: closed and merged pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mint the cleanup App's installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ARTIFACT_CLEANUP_APP_ID }}
          private-key: ${{ secrets.ARTIFACT_CLEANUP_APP_PRIVATE_KEY }}
          owner: systemfsoftware
          permission-actions: write
          permission-contents: read
          permission-pull-requests: read
      - name: Delete artifacts of closed and merged pull requests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: systemfsoftware
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?the cleanup App token was not minted}"
          work="$(mktemp -d)"

          # One repo: list its closed or merged PR head branches once, then write the artifacts whose run's branch
          # is among them as "repo<TAB>id<TAB>bytes" lines. Artifacts with no branch are kept.
          plan_repo() {
            local repo="$1" out="$work/${1//\//_}"
            gh api "repos/$repo/pulls?state=closed&per_page=100" --paginate \
              --jq ".[] | select(.head.repo.owner.login == \"$ORG\") | .head.ref" | sort -u > "$out.closed"
            gh api "repos/$repo/actions/artifacts?per_page=100" --paginate \
              --jq '.artifacts[] | [((.workflow_run.head_branch // "") | if . == "" then "-" else . end), .id, (.size_in_bytes // 0)] | @tsv' \
              > "$out.artifacts"
            awk -F'\t' -v repo="$repo" 'NR == FNR { closed[$0] = 1; next } ($1 in closed) { print repo "\t" $2 "\t" $3 }' \
              "$out.closed" "$out.artifacts" > "$out.delete"
            echo "$(wc -l < "$out.artifacts") $(wc -l < "$out.delete")" > "$out.counts"
          }
          export -f plan_repo
          export work

          # One delete, recorded in $work/{ok,gone,skipped,transient,fatal}. It stops issuing calls once the installation's
          # remaining quota is at or below MIN_REMAINING (the rate_limit call is not itself counted), retries HTTP 5xx
          # up to 3 times, and files anything else by cause. $work/stop marks that the quota ran out.
          delete_one() {
            local repo="$1" id="$2" bytes="$3" left err code try
            if [ -e "$work/stop" ]; then echo "$repo $id" >> "$work/skipped"; return 0; fi
            left="$(gh api rate_limit --jq .resources.core.remaining 2>/dev/null || echo 99999)"
            if [ "$left" -le "$MIN_REMAINING" ]; then
              touch "$work/stop"; echo "$repo $id" >> "$work/skipped"; return 0
            fi
            for try in 1 2 3 4; do
              if err="$(gh api -X DELETE "repos/$repo/actions/artifacts/$id" --silent 2>&1)"; then
                printf '%s\t%s\t%s\n' "$repo" "$id" "$bytes" >> "$work/ok"; return 0
              fi
              code="$(printf '%s' "$err" | grep -o 'HTTP [0-9]*' | head -1 | cut -d' ' -f2)"
              case "$code" in
                404) echo "$repo $id" >> "$work/gone"; return 0 ;;
                5??) [ "$try" -lt 4 ] && { sleep $((try * 3)); continue; }
                     echo "$repo $id HTTP $code" >> "$work/transient"; return 0 ;;
                *)   if printf '%s' "$err" | grep -qi 'rate limit'; then
                       touch "$work/stop"; echo "$repo $id" >> "$work/skipped"
                     else
                       echo "$repo $id HTTP ${code:-none}: $(printf '%s' "$err" | head -1)" >> "$work/fatal"
                     fi
                     return 0 ;;
              esac
            done
          }
          export -f delete_one
          export MIN_REMAINING=200

          # Repos are planned 4 at a time, and deletes run 8 at a time, under GitHub's concurrent-request limit.
          gh api "orgs/$ORG/repos?per_page=100" --paginate --jq '.[] | select(.private == true) | .full_name' \
            | xargs -r -P 4 -I{} bash -c 'plan_repo "$1"' _ {}
          touch "$work/ok" "$work/gone" "$work/skipped" "$work/transient" "$work/fatal"
          cat "$work"/*.delete 2>/dev/null \
            | xargs -r -P 8 -n 3 bash -c 'delete_one "$@"' _

          total=0; planned=0
          for c in "$work"/*.counts; do read -r t d < "$c"; total=$((total + t)); planned=$((planned + d)); done
          deleted="$(wc -l < "$work/ok")"
          reclaimed="$(awk -F'\t' '{ s += $3 } END { print s + 0 }' "$work/ok")"
          gone="$(wc -l < "$work/gone")"; skipped="$(wc -l < "$work/skipped")"
          transient="$(wc -l < "$work/transient")"; fatal="$(wc -l < "$work/fatal")"
          left="$(gh api rate_limit --jq .resources.core.remaining 2>/dev/null || echo unknown)"
          {
            echo '**Artifacts deleted (runs of closed or merged pull requests)**'
            echo
            echo '| repo | deleted | bytes |'
            echo '|---|---|---|'
            awk -F'\t' '{ n[$1]++; b[$1] += $3 } END { for (r in n) print "| `" r "` | " n[r] " | " b[r] " |" }' "$work/ok"
            echo
            echo "Deleted $deleted of $planned planned ($total artifacts seen), $reclaimed bytes reclaimed."
            echo
            echo "- already gone (HTTP 404): $gone"
            echo "- not attempted, installation rate limit reached (next run continues): $skipped"
            echo "- failed, transient (HTTP 5xx after retries): $transient"
            echo "- failed, non-transient (4xx other than 404, or no HTTP status): $fatal"
            echo "- installation rate limit remaining at the end: $left"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=artifact-cleanup::Deleted $deleted of $planned planned, reclaimed $reclaimed bytes; $skipped not attempted (rate limit), $transient transient failures, $fatal other failures"
          if [ "$fatal" -gt 0 ]; then
            echo "::error title=artifact-cleanup::$fatal deletes failed with a non-transient error"
            cut -d' ' -f3- "$work/fatal" | sort | uniq -c | sort -rn >&2
            exit 1
          fi
