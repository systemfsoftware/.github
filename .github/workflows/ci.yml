name: CI

# One job on every pull request, with no path filter, so the required `check` is emitted for every change, docs-only
# ones included. It fails on any YAML file that is empty, does not parse or repeats a key.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PyYAML
        run: python3 -m pip install --user 'PyYAML==6.0.2'
      - name: Every YAML file parses, is not empty and repeats no key
        run: python3 .github/scripts/check-yaml.py .
