name: CI

# One job on every pull request, with no path filter, so the required `check` is emitted for every change, docs-only
# ones included. It parses every workflow and config file in the repository as YAML.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every workflow and config file parses as YAML
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml
          failed = False
          for path in sorted([*pathlib.Path('.github').rglob('*.y*ml'), *pathlib.Path('.').glob('*.y*ml')]):
              try:
                  list(yaml.safe_load_all(path.read_text()))
              except yaml.YAMLError as error:
                  failed = True
                  print(f'{path}: {error}')
          sys.exit(1 if failed else 0)
          PY
